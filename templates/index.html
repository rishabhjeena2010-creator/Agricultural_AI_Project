
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Details - AI Agricultural Yield Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌾 AI Agricultural Yield Prediction</h1>
        <p>Enter your farm information to estimate crop yield</p>
    </div>

    <div class="card">

        <h2>Selected Farm</h2>

        <div class="selected-info">
            <p><strong>State:</strong> {{ state }}</p>
            <p><strong>District:</strong> {{ district }}</p>
            <p><strong>Crop:</strong> {{ crop_type }}</p>
        </div>

        <form method="POST">

            <h2>Farm Information</h2>

            <div class="form-group">
                <label for="crop_year">Crop Year</label>
                <input
                    type="number"
                    id="crop_year"
                    name="crop_year"
                    value="2026"
                    required>
            </div>

            <div class="form-group">
                <label for="season">Season</label>
                <select id="season" name="season" required>
                    <option value="Kharif">Kharif</option>
                    <option value="Rabi">Rabi</option>
                    <option value="Zaid">Zaid</option>
                </select>
            </div>

            <div class="form-group">
                <label for="area_hectares">Area (hectares)</label>
                <input
                    type="number"
                    id="area_hectares"
                    name="area_hectares"
                    step="0.1"
                    min="0.1"
                    required>
            </div>

            <h2>Fertilizer & Irrigation</h2>

            <div class="form-group">
                <label for="fertilizer_type">Fertilizer Type</label>
                <select
                    id="fertilizer_type"
                    name="fertilizer_type"
                    required>

                    <option value="NPK">NPK</option>
                    <option value="Urea">Urea</option>
                    <option value="DAP">DAP</option>
                    <option value="Organic">Organic</option>

                </select>
            </div>

            <div class="form-group">
                <label for="fertilizer_amount">
                    Fertilizer Amount (kg/ha)
                </label>

                <input
                    type="number"
                    id="fertilizer_amount"
                    name="fertilizer_amount"
                    step="0.1"
                    min="0"
                    required>
            </div>

            <div class="form-group">
                <label for="irrigation_method">Irrigation Method</label>

                <select
                    id="irrigation_method"
                    name="irrigation_method"
                    required>

                    <option value="Drip">Drip</option>
                    <option value="Flood">Flood</option>
                    <option value="Sprinkler">Sprinkler</option>
                    <option value="Rainfed">Rainfed</option>

                </select>
            </div>

            <div class="form-group">
                <label for="irrigation_frequency">
                    Irrigation Frequency
                </label>

                <input
                    type="number"
                    id="irrigation_frequency"
                    name="irrigation_frequency"
                    step="0.1"
                    min="0"
                    required>
            </div>

            <h2>Pest Information</h2>

            <div class="form-group">
                <label for="pesticide_used">Pesticide Used</label>

                <select
                    id="pesticide_used"
                    name="pesticide_used"
                    required>

                    <option value="Yes">Yes</option>
                    <option value="No">No</option>

                </select>
            </div>

            <div class="form-group">
                <label for="pest_infection_level">
                    Pest Infection Level
                </label>

                <select
                    id="pest_infection_level"
                    name="pest_infection_level"
                    required>

                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>

                </select>
            </div>

            <h2>Sowing Information</h2>

            <div class="form-group">
                <label for="sowing_month">Sowing Month</label>

                <select
                    id="sowing_month"
                    name="sowing_month"
                    required>

                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>

                </select>
            </div>

            <button type="submit">
                🌱 Predict Yield
            </button>

        </form>

    </div>

    <div class="footer">
        AI Agricultural Yield Prediction System
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Farm - AI Agricultural Yield Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <!-- DASHBOARD LINK -->

    <div style="text-align: right; margin-bottom: 15px;">
        <a href="{{ url_for('dashboard') }}"
           style="text-decoration: none;
                  color: #16833f;
                  font-weight: 600;">
            🏠 Dashboard
        </a>
    </div>


    <!-- HEADER -->

    <div class="header">

        <h1>🌾 AI Agricultural Yield Prediction</h1>

        <p>
            AI-powered farm yield and weather suitability analysis
        </p>

    </div>


    <!-- FARM SELECTION CARD -->

    <div class="card">

        <h2>Select Farm Details</h2>

        <form method="POST">

            <!-- STATE -->

            <div class="form-group">

                <label for="state">
                    State
                </label>

                <input
                    type="text"
                    id="state"
                    name="state"
                    placeholder="Enter state"
                    required
                >

            </div>


            <!-- DISTRICT -->

            <div class="form-group">

                <label for="district">
                    District
                </label>

                <input
                    type="text"
                    id="district"
                    name="district"
                    placeholder="Enter district"
                    required
                >

            </div>


            <!-- CROP -->

            <div class="form-group">

                <label for="crop_type">
                    Crop
                </label>

                <select
                    id="crop_type"
                    name="crop_type"
                    required
                >

                    <option value="">
                        Select a crop
                    </option>

                    <option value="Maize">
                        Maize
                    </option>

                    <option value="Rice">
                        Rice
                    </option>

                    <option value="Wheat">
                        Wheat
                    </option>

                    <option value="Cotton">
                        Cotton
                    </option>

                    <option value="Mustard">
                        Mustard
                    </option>

                    <option value="Groundnut">
                        Groundnut
                    </option>

                    <option value="Soybean">
                        Soybean
                    </option>

                    <option value="Bajra">
                        Bajra
                    </option>

                    <option value="Jowar">
                        Jowar
                    </option>

                    <option value="Barley">
                        Barley
                    </option>

                    <option value="Moong">
                        Moong
                    </option>

                </select>

            </div>


            <!-- SUBMIT -->

            <button type="submit">
                Continue →
            </button>

        </form>

    </div>


    <!-- FOOTER -->

    <div class="footer">
        AI Agricultural Yield Prediction System
    </div>

</div>

</body>
</html>

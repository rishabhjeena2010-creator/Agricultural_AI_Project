<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Farm - AI Agricultural Yield Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌾 AI Agricultural Yield Prediction</h1>
        <p>AI-powered farm yield and weather suitability analysis</p>
    </div>

    <div class="card">

        <h2>Select Farm Details</h2>

        <form method="POST">

            <div class="form-group">
                <label for="state">State</label>
                <input
                    type="text"
                    id="state"
                    name="state"
                    placeholder="Enter state"
                    required>
            </div>

            <div class="form-group">
                <label for="district">District</label>
                <input
                    type="text"
                    id="district"
                    name="district"
                    placeholder="Enter district"
                    required>
            </div>

            <div class="form-group">
                <label for="crop_type">Crop</label>

                <select id="crop_type"
                        name="crop_type"
                        required>

                    <option value="">Select a crop</option>
                    <option value="Maize">Maize</option>
                    <option value="Rice">Rice</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Cotton">Cotton</option>
                    <option value="Mustard">Mustard</option>
                    <option value="Groundnut">Groundnut</option>
                    <option value="Soybean">Soybean</option>
                    <option value="Bajra">Bajra</option>
                    <option value="Jowar">Jowar</option>
                    <option value="Barley">Barley</option>
                    <option value="Moong">Moong</option>

                </select>
            </div>

            <button type="submit">
                Continue →
            </button>

        </form>

    </div>

    <div class="footer">
        AI Agricultural Yield Prediction System
    </div>

</div>

</body>
</html>
